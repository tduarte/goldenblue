---
name: Build installer ISO
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build anaconda ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/iso-gnome.toml
          image: ghcr.io/${{ github.repository_owner }}/goldenblue:latest
          chown: '1001:1001'
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldenblue-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
